# =========================================================
#  MANTENIMIENTO de admin.tudominio.com  ->  /var/www/mantenimiento
#  Sustituye a taz-admin.conf (no activar los dos a la vez).
#  Responde 503 para que Google no indexe la página de mantenimiento.
# =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.tudominio.com;

    include snippets/taz-ssl.conf;

    root /var/www/mantenimiento;

    location / {
        return 503;
    }

    error_page 503 /index.html;
    location = /index.html {
        internal;
        add_header Retry-After 3600 always;
    }

    # Archivos de la página de mantenimiento (css, imágenes...)
    location /recursos/ {
        try_files $uri =404;
    }
}
