# =========================================================
#  HTTP (puerto 80) -> HTTPS para todos los dominios
#  Debe estar SIEMPRE activo.
# =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com admin.tudominio.com;
    return 301 https://$host$request_uri;
}
