# =========================================================
#  tudominio.com  ->  /var/www/consumidor
# =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    include snippets/taz-ssl.conf;

    root /var/www/consumidor;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    include snippets/taz-api.conf;
}
