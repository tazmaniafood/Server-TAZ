# =========================================================
#  admin.tudominio.com  ->  /var/www/admin
# =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.tudominio.com;

    include snippets/taz-ssl.conf;

    root /var/www/admin;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    include snippets/taz-api.conf;
}
